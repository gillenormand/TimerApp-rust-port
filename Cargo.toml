[package]
name = "timer_app"
version = "0.8.5"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.9.0", default-features = false, features = [
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "std"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.9.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true